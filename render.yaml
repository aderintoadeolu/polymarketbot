services:
  - type: web
    name: polymarket-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: INTERVAL
        value: 20
      - key: MIN_MARGIN
        value: 0.01
      - key: MIN_SPREAD
        value: 0.03
